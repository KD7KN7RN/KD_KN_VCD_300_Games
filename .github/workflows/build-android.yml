name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # ملف capacitor.config.ts يحتوي على server.url يشير إلى موقع Lovable،
      # فيتم حذفه حتى يحمّل التطبيق ملفات dist المضمّنة داخل الـ APK
      - name: Remove remote server URL from Capacitor config
        run: perl -0pi -e 's/,\s*server:\s*\{.*?\}//s' capacitor.config.ts

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vcd-300-games.apk

      # الرفع إلى Releases لا يستهلك حصة تخزين الـ artifacts
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: vcd-300-games.apk
