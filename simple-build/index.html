<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>VCD 300 Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- شاشة البداية -->
  <div id="intro-screen" class="screen">
    <video id="intro-video" playsinline loop>
      <source src="assets/videos/intro.mp4" type="video/mp4">
    </video>
    <div class="intro-text">اضغط للمتابعة</div>
  </div>

  <!-- قائمة الألعاب -->
  <div id="menu-screen" class="screen hidden">
    <div class="menu-container">
      <!-- أزرار الأرقام - يسار -->
      <div class="number-buttons">
        <button class="num-btn" data-num="0">0</button>
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
      </div>

      <!-- صورة الصفحة -->
      <div class="page-display">
        <img id="page-image" src="assets/images/pages/page-01.png" alt="Games Page">
      </div>

      <!-- معلومات وتنقل - يمين -->
      <div class="info-panel">
        <div class="title">
          <h1>VCD</h1>
          <h2>300</h2>
        </div>
        <div class="page-number">
          <span id="current-page">1</span>
          <span class="separator">/</span>
          <span id="total-pages">30</span>
        </div>
        <div class="nav-buttons">
          <button id="prev-btn" class="nav-btn">▲</button>
          <button id="next-btn" class="nav-btn">▼</button>
        </div>
      </div>
    </div>
  </div>

  <!-- شاشة اللعب -->
  <div id="game-screen" class="screen hidden">
    <div class="game-container">
      <!-- أزرار A/B (للوضع العرضي) -->
      <div class="left-controls landscape-only">
        <div class="action-buttons">
          <button class="action-btn a-btn" data-btn="A">A</button>
          <button class="action-btn b-btn" data-btn="B">B</button>
        </div>
      </div>

      <!-- شاشة اللعبة -->
      <div class="game-display">
        <div class="game-header">
          <span id="game-title">Game</span>
          <button id="exit-btn" class="exit-btn">✕</button>
        </div>
        <div class="canvas-wrapper">
          <div id="loading-text" class="loading">جاري التحميل...</div>
          <div id="error-text" class="error hidden"></div>
          <canvas id="game-canvas" width="256" height="240"></canvas>
        </div>

        <!-- أزرار التحكم (الوضع الطولي - معكوسة) -->
        <div class="portrait-controls portrait-only">
          <div class="action-buttons portrait-action">
            <button class="action-btn b-btn" data-btn="B">B</button>
            <button class="action-btn a-btn" data-btn="A">A</button>
          </div>
          <div class="small-buttons portrait-small">
            <button class="small-btn" data-btn="SELECT">SELECT</button>
            <button class="small-btn" data-btn="START">START</button>
          </div>
          <div class="dpad portrait-dpad">
            <button class="dpad-btn up" data-btn="UP">▲</button>
            <button class="dpad-btn left" data-btn="LEFT">◀</button>
            <div class="dpad-center"></div>
            <button class="dpad-btn right" data-btn="RIGHT">▶</button>
            <button class="dpad-btn down" data-btn="DOWN">▼</button>
          </div>
        </div>
      </div>

      <!-- D-Pad (للوضع العرضي) -->
      <div class="right-controls landscape-only">
        <div class="dpad">
          <button class="dpad-btn up" data-btn="UP">▲</button>
          <button class="dpad-btn left" data-btn="LEFT">◀</button>
          <div class="dpad-center"></div>
          <button class="dpad-btn right" data-btn="RIGHT">▶</button>
          <button class="dpad-btn down" data-btn="DOWN">▼</button>
        </div>
        <div class="small-buttons">
          <button class="small-btn" data-btn="SELECT">SELECT</button>
          <button class="small-btn" data-btn="START">START</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Libraries (محلية - تعمل بدون إنترنت) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="jsnes.js"></script>
  <script src="app.js"></script>
</body>
</html>
